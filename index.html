<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hyperion</title>
    <!-- An empty icon, so the browser doesn't request /favicon.ico and log a 404. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view" aria-label="Real-time ray-traced scene. Drag or use the arrow keys to orbit, scroll to zoom, WASD to fly."></canvas>
    <pre id="hud" hidden></pre>
    <div id="scene-picker">
      <label>Scene <select id="scene"></select></label>
      <!-- Filled in by ui/scene-sliders.ts for scenes that have sliders. -->
      <div id="scene-sliders" hidden></div>
    </div>
    <!-- Filled in by ui/settings-panel.ts. -->
    <details id="settings" open><summary>Renderer</summary></details>
    <div id="message" role="alert" hidden></div>
    <noscript>Hyperion needs JavaScript and WebGPU to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
